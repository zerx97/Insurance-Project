server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insurenext_auth}
    username: ${DB_USER:insurenext}
    password: ${DB_PASSWORD:insurenext}
  jpa:
    hibernate:
      ddl-auto: validate   # schema changes only via Flyway migrations, never auto-DDL in prod
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-replace-in-prod-via-secrets-manager}
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    com.insurenext: INFO
