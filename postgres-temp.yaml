apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-internal
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-internal }
  template:
    metadata:
      labels: { app: postgres-internal }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: insurenext
            - name: POSTGRES_PASSWORD
              value: insurenext
            - name: POSTGRES_DB
              value: insurenext_auth
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-internal
spec:
  selector: { app: postgres-internal }
  ports:
    - port: 5432
