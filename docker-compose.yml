services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insurenext
      POSTGRES_PASSWORD: insurenext
      POSTGRES_DB: insurenext_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurenext -d insurenext_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Official Apache Kafka image (maintained by the Kafka project itself), single-node KRaft
  # mode - no Zookeeper needed. NOT bitnami/kafka: Bitnami moved most versioned tags off the
  # free Docker Hub tier in 2025, leaving only a moving "latest" tag - not something you want
  # to depend on for a real project. This image gives you a pinned, stable version instead.
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_auth
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }

  policy-service:
    build: ./policy-service
    ports: ["8082:8082"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_policy
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_healthy

  billing-service:
    build: ./billing-service
    ports: ["8083:8083"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_billing
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_healthy

  claims-service:
    build: ./claims-service
    ports: ["8084:8084"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_claims
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    ports: ["8085:8085"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  fraud-detection-service:
    build: ./fraud-detection-service
    ports: ["8086:8086"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - auth-service
      - policy-service
      - billing-service
      - claims-service

volumes:
  pgdata:
