version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insurenext
      POSTGRES_PASSWORD: insurenext
      POSTGRES_DB: insurenext_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurenext"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Single-node Kafka in KRaft mode: no separate Zookeeper container needed
  # (Zookeeper is legacy for new Kafka setups since Kafka 3.5+ - KRaft is the current default)
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"

  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_auth
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }

  policy-service:
    build: ./policy-service
    ports: ["8082:8082"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_policy
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_started

  billing-service:
    build: ./billing-service
    ports: ["8083:8083"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_billing
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_started

  claims-service:
    build: ./claims-service
    ports: ["8084:8084"]
    environment:
      DB_HOST: postgres
      DB_NAME: insurenext_claims
      DB_USER: insurenext
      DB_PASSWORD: insurenext
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: local-dev-shared-secret-change-in-real-deployments
    depends_on:
      postgres: { condition: service_healthy }
      kafka:
        condition: service_started

  notification-service:
    build: ./notification-service
    ports: ["8085:8085"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  fraud-detection-service:
    build: ./fraud-detection-service
    ports: ["8086:8086"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - auth-service
      - policy-service
      - billing-service
      - claims-service

volumes:
  pgdata:
