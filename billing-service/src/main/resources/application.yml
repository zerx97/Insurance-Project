server:
  port: 8083

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:insurenext_billing}
    username: ${DB_USER:insurenext}
    password: ${DB_PASSWORD:insurenext}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-replace-in-prod-via-secrets-manager}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
