apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/insurenext-config.git
    targetRevision: main
    path: helm/insurenext-service
    helm:
      valueFiles:
        - ../per-service-values/values-auth-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: insurenext-prod
  syncPolicy:
    # Staging: fully automated. Prod: automated block below is OMITTED on purpose -
    # this is exactly the "manual sync gate for prod" described in the docs.
    automated:
      prune: true
      selfHeal: true
